# Tien to dung la server.error.*, khong phai spring.web.error.*
# Dat sai tien to nen body loi tra ve khong he co truong "message",
# khien giao dien luon hien thong bao du phong chung chung.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Gioi han upload. Mac dinh cua Spring Boot chi 1MB nen anh chup tu dien thoai
# (thuong 2-5MB) bi tu choi ngay truoc khi vao controller.
