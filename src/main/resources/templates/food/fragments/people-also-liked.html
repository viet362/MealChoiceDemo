<!-- Fragment Mọi người cũng thích (8 món) -->
<section th:fragment="peopleAlsoLiked" class="py-4 mb-5" xmlns:th="http://www.thymeleaf.org">
    <div class="container">
        <!-- Section Header -->
        <div class="d-flex align-items-center gap-2 mb-4">
            <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-2.5 py-1 fs-8 fw-bold">
                <i class="bi bi-hand-thumbs-up-fill me-1"></i>Xu hướng ẩm thực
            </span>
            <h4 class="fw-bold text-dark mb-0">Mọi người cũng thích</h4>
        </div>

        <!-- 8 Foods Grid (4 Cột x 2 Hàng) -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${peopleAlsoLiked != null and !#lists.isEmpty(peopleAlsoLiked)}">
            <th:block th:each="likedFood : ${peopleAlsoLiked}">
                <!-- Tái sử dụng fragment card món ăn từ trang chủ -->
                <div th:replace="~{homepage/food-card-item :: foodCard(food=${likedFood})}"></div>
            </th:block>
        </div>

        <!-- Fallback if empty -->
        <div th:if="${peopleAlsoLiked == null or #lists.isEmpty(peopleAlsoLiked)}" class="text-center py-4 text-muted bg-white rounded-4 shadow-sm">
            <i class="bi bi-shop-window fs-1 text-secondary mb-2 d-block"></i>
            <p class="mb-0 fs-7">Hiện chưa có món ăn được yêu thích nào cùng danh mục tại khu vực này.</p>
        </div>
    </div>
</section>
