<!-- Fragment Thông tin cơ bản món ăn -->
<div th:fragment="foodInfo" class="pb-3" xmlns:th="http://www.thymeleaf.org">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white p-4">
        <div class="row g-4 align-items-start">
            <!-- Cột Trái: Ảnh đại diện lớn và hàng ảnh nhỏ chi tiết -->
            <div class="col-12 col-md-5">
                <div class="position-relative rounded-4 overflow-hidden shadow-sm">
                    <!-- Ratio chỉ chứa ảnh để tỉ lệ khung hình chuẩn -->
                    <div class="ratio ratio-4x3 bg-light">
                        <img th:src="${foodImagesList != null and !#lists.isEmpty(foodImagesList)} ? ${foodImagesList[0]} : (${food.images != null and !#lists.isEmpty(food.images)} ? ${food.images[0].imageUrl} : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80')"
                             id="mainFoodImage"
                             class="img-fluid object-fit-cover w-100 h-100" th:alt="${food.foodName}"
                             style="transition: opacity 0.2s ease, transform 0.5s ease;">
                    </div>
                    
                    <!-- Discount Badge -->
                    <span th:if="${food.discountPrice != null and food.price != null and food.price > 0}"
                          class="position-absolute top-0 start-0 m-3 z-3 text-white fw-bold fs-7 shadow-sm d-inline-block text-center"
                          style="background-color: #ff4b2b; padding: 6px 12px; border-radius: 50px; width: auto !important; height: auto !important; line-height: 1.2; min-width: 50px;"
                          th:text="'-' + ${#numbers.formatDecimal((food.price - food.discountPrice) / food.price * 100, 0, 0)} + '%'">-20%</span>
                         
                    <!-- Mũi tên Carousel 2 bên -->
                    <button type="button" 
                            class="btn position-absolute top-50 start-0 translate-middle-y ms-2 z-3 rounded-circle d-flex align-items-center justify-content-center border-0 text-white shadow-sm"
                            style="background: rgba(0, 0, 0, 0.4); width: 36px; height: 36px; transition: background-color 0.25s; cursor: pointer;"
                            onmouseover="this.style.backgroundColor='rgba(0, 0, 0, 0.65)'"
                            onmouseout="this.style.backgroundColor='rgba(0, 0, 0, 0.4)'"
                            onclick="prevDetailImage(event)">
                        <i class="bi bi-chevron-left fw-bold fs-5"></i>
                    </button>
                    <button type="button" 
                            class="btn position-absolute top-50 end-0 translate-middle-y me-2 z-3 rounded-circle d-flex align-items-center justify-content-center border-0 text-white shadow-sm"
                            style="background: rgba(0, 0, 0, 0.4); width: 36px; height: 36px; transition: background-color 0.25s; cursor: pointer;"
                            onmouseover="this.style.backgroundColor='rgba(0, 0, 0, 0.65)'"
                            onmouseout="this.style.backgroundColor='rgba(0, 0, 0, 0.4)'"
                            onclick="nextDetailImage(event)">
                        <i class="bi bi-chevron-right fw-bold fs-5"></i>
                    </button>
                </div>

                <!-- Hàng ảnh nhỏ chi tiết (Thumbnails) -->
                <div class="d-flex gap-2 mt-3 overflow-x-auto pb-1" th:if="${foodImagesList != null and !#lists.isEmpty(foodImagesList)}">
                    <div th:each="imgUrl, iterStat : ${foodImagesList}" 
                         th:class="${iterStat.first} ? 'ratio ratio-1x1 rounded-3 overflow-hidden border border-2 border-danger cursor-pointer thumb-img-container' : 'ratio ratio-1x1 rounded-3 overflow-hidden border border-2 border-light cursor-pointer thumb-img-container'"
                         style="width: 60px; height: 60px; flex-shrink: 0;" 
                         th:data-img-url="${imgUrl}"
                         onclick="changeMainImage(this, this.dataset.imgUrl)">
                        <img th:src="${imgUrl}" class="w-100 h-100 object-fit-cover" th:alt="'Ảnh chi tiết ' + ${iterStat.count}">
                    </div>
                </div>
            </div>

            <!-- Cột Phải: Thông tin chi tiết món ăn -->
            <div class="col-12 col-md-7 d-flex flex-column h-100">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span th:if="${food.tags != null and !#lists.isEmpty(food.tags)}"
                          class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-2.5 py-1 fs-8 fw-bold"
                          th:text="${food.tags[0].tagName}">Nổi bật</span>
                    <span th:if="${food.foodCategories != null and !#lists.isEmpty(food.foodCategories)}"
                          class="badge bg-light text-secondary border rounded-pill px-2.5 py-1 fs-8"
                          th:text="${food.foodCategories[0].categoryName}">Món chính</span>
                </div>

                <h2 class="fw-extrabold text-dark mb-2" th:text="${food.foodName}">Tên món ăn</h2>

                <!-- Merchant & Address info -->
                <div class="p-3 rounded-3 bg-light bg-opacity-50 border border-light-subtle mb-3">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                <i class="bi bi-shop fs-6"></i>
                            </div>
                            <div>
                                <a th:if="${food.merchant != null}"
                                   th:href="@{'/stores/' + ${food.merchant.id}}"
                                   class="text-decoration-none text-dark fw-bold fs-6 transition-hover d-inline-flex align-items-center gap-1.5"
                                   th:title="'Xem trang của ' + ${food.merchant.merchantRestaurantName}">
                                    <span th:text="${food.merchant.merchantRestaurantName}">Tên nhà hàng</span>
                                    <i class="bi bi-arrow-right-short fs-5 text-danger"></i>
                                </a>
                                <span th:if="${food.merchant != null and food.merchant.trustedPartner}"
                                      class="badge bg-success bg-opacity-10 text-success rounded-pill px-2 py-0.5 fs-9 fw-semibold ms-1">
                                    <i class="bi bi-patch-check-fill me-0.5"></i>Đối tác uy tín
                                </span>
                            </div>
                        </div>

                        <button th:if="${food.merchant != null}"
                                type="button"
                                th:class="${likedMerchantIds != null and likedMerchantIds.contains(food.merchant.id.toString())} ? 'btn btn-danger btn-sm rounded-pill px-3 py-1 fw-semibold fs-8 transition-hover btn-follow-merchant shadow-xs' : 'btn btn-outline-danger btn-sm rounded-pill px-3 py-1 fw-semibold fs-8 transition-hover btn-follow-merchant'"
                                th:data-merchant-id="${food.merchant.id.toString()}"
                                id="btnFollowMerchant">
                            <i th:class="${likedMerchantIds != null and likedMerchantIds.contains(food.merchant.id.toString())} ? 'bi bi-check-lg me-1' : 'bi bi-plus-lg me-1'"></i>
                            <span th:text="${likedMerchantIds != null and likedMerchantIds.contains(food.merchant.id.toString())} ? 'Đang theo dõi' : 'Theo dõi'">Theo dõi</span>
                        </button>
                    </div>

                    <!-- Địa chỉ quán -->
                    <p class="text-muted fs-8 mb-2 d-flex align-items-start gap-1.5">
                        <i class="bi bi-geo-alt-fill text-danger flex-shrink-0 mt-0.5"></i>
                        <span th:text="${food.merchantAddress != null ? food.merchantAddress.merchantAddress : 'Chưa có địa chỉ chi tiết'}">Địa chỉ quán</span>
                    </p>

                    <!-- Tag thế mạnh / Dòng món chủ đạo của quán -->
                    <div class="d-flex flex-wrap align-items-center gap-1.5 pt-2 border-top border-light-subtle"
                         th:if="${storeSpecialties != null and !#lists.isEmpty(storeSpecialties)}">
                        <span class="fs-9 text-muted fw-bold text-uppercase me-1"><i class="bi bi-fire text-danger me-1"></i>Thế mạnh quán:</span>
                        <a th:each="spec : ${storeSpecialties}"
                           th:if="${food.merchant != null}"
                           th:href="@{'/stores/' + ${food.merchant.id}(categoryId=${spec.id})}"
                           class="badge bg-white text-danger border border-danger border-opacity-25 rounded-pill px-2.5 py-1 fs-8 fw-semibold text-decoration-none transition-hover shadow-xs"
                           th:text="${spec.categoryName}">Món Việt</a>
                    </div>
                </div>

                <!-- Rating, Preparation Time, Service Fee -->
                <div class="d-flex flex-wrap gap-4 align-items-center py-3 mb-3 border-top border-bottom border-light-subtle">
                    <div class="d-flex align-items-center gap-1">
                        <i class="bi bi-star-fill text-warning fs-5"></i>
                        <span class="text-dark fw-bold fs-6">4.5</span>
                        <span class="text-muted fs-8">(120+ đánh giá)</span>
                    </div>
                    <div class="d-flex align-items-center gap-1.5">
                        <i class="bi bi-clock-history text-primary fs-5"></i>
                        <span class="text-dark fw-semibold fs-6" th:text="${food.preparationTime != null ? food.preparationTime + ' phút' : '15-25 phút'}">15-25 phút</span>
                        <span class="text-muted fs-8">(Chuẩn bị)</span>
                    </div>
                    <div class="d-flex align-items-center gap-1.5" th:if="${food.serviceFee != null and food.serviceFee > 0}">
                        <i class="bi bi-info-circle text-success fs-5"></i>
                        <span class="text-dark fw-semibold fs-6" th:text="${#numbers.formatDecimal(food.serviceFee, 0, 'COMMA', 0, 'POINT') + ' đ'}">3.000 đ</span>
                        <span class="text-muted fs-8">(Phí dịch vụ)</span>
                    </div>
                </div>

                <!-- Price and Discount Info -->
                <div class="mb-4">
                    <div class="d-flex align-items-baseline gap-3 mb-1">
                        <h3 class="fw-extrabold text-danger mb-0"
                            th:text="${food.discountPrice != null ? #numbers.formatDecimal(food.discountPrice, 0, 'COMMA', 0, 'POINT') + ' đ' : #numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">45.000 đ</h3>
                        <span th:if="${food.discountPrice != null}"
                              class="text-muted text-decoration-line-through fs-6"
                              th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">60.000 đ</span>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-2" th:if="${food.discountPrice != null and food.price != null and food.price > 0}">
                        <span class="badge bg-danger bg-opacity-10 text-danger rounded-1 px-2 py-1 fs-8 fw-bold">ƯU ĐÃI ĐANG ÁP DỤNG</span>
                        <span class="text-danger fw-semibold fs-7" th:text="'Giảm trực tiếp ' + ${#numbers.formatDecimal((food.price - food.discountPrice) / food.price * 100, 0, 0)} + '%'">Giảm 20%</span>
                    </div>
                </div>

                <!-- Note / Description -->
                <div class="mb-4" th:if="${food.foodNote != null and !#strings.isEmpty(food.foodNote)}">
                    <h6 class="fw-bold text-dark mb-1">Ghi chú của quán:</h6>
                    <p class="text-muted fs-7 mb-0" th:text="${food.foodNote}">Ghi chú món ăn</p>
                </div>

                <!-- CTA Add to Cart / Order button -->
                <div class="mt-auto pt-2">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <!-- Nhóm 1: Đặt Mua Ngay & Thêm Vào Giỏ (luôn đi cùng nhau) -->
                        <div class="d-flex gap-2 flex-grow-1" style="min-width: 280px;">
                            <!-- Nút Đặt Mua Ngay -->
                            <button id="btnMainAddToCart" class="btn btn-danger rounded-pill py-2.5 px-3 fw-bold flex-grow-1 shadow-sm transition-hover d-flex align-items-center justify-content-center gap-1.5 fs-7"
                                    style="background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; height: 48px;">
                                <i class="bi bi-cart-fill fs-6"></i>
                                <span class="text-nowrap">Đặt Mua Ngay</span>
                            </button>

                            <!-- Nút Thêm vào giỏ hàng -->
                            <button id="btnMainAddToNavbarCart" class="btn btn-outline-danger rounded-pill py-2.5 px-3 fw-bold flex-grow-1 transition-hover d-flex align-items-center justify-content-center gap-1.5 fs-7"
                                    style="border-width: 2px; height: 48px;">
                                <i class="bi bi-cart-plus fs-6"></i>
                                <span class="text-nowrap" id="btnAddCartText">Thêm vào giỏ hàng</span>
                            </button>
                        </div>

                        <!-- Nhóm 2: Vào Cửa Hàng & Yêu Thích (xuống dòng cùng nhau khi co nhỏ) -->
                        <div class="d-flex gap-2 align-items-center flex-shrink-0">
                            <!-- Nút Vào Cửa Hàng -->
                            <a th:if="${food.merchant != null}" 
                               th:href="@{'/stores/' + ${food.merchant.id}}"
                               class="btn btn-outline-secondary rounded-pill py-2.5 px-3.5 fw-bold transition-hover d-flex align-items-center justify-content-center gap-1.5 fs-7"
                               style="border-width: 2px; height: 48px; white-space: nowrap;">
                                <i class="bi bi-shop fs-6 text-danger"></i>
                                <span>Vào Cửa Hàng</span>
                            </a>
                            
                            <!-- Nút Yêu Thích -->
                            <button class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center border-2 btn-wishlist btn-wishlist-detail"
                                    style="width: 48px; height: 48px; flex-shrink: 0;" 
                                    th:data-food-id="${food.id}"
                                    th:title="${likedFoodIds != null and likedFoodIds.contains(food.id)} ? 'Bỏ yêu thích' : 'Yêu thích'">
                                <i th:class="${likedFoodIds != null and likedFoodIds.contains(food.id)} ? 'bi bi-heart-fill fs-5 text-danger' : 'bi bi-heart fs-5 text-danger'"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
