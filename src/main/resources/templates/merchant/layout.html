<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="shell(pageTitle, activeMenu, content)" class="merchant-shell">
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="merchant-workspace">
        <div class="merchant-backdrop" data-merchant-sidebar-backdrop></div>

        <aside th:replace="~{merchant/sidebar :: sidebar(${activeMenu})}"></aside>

        <main class="merchant-main">
            <div class="merchant-main-inner">
                <div class="merchant-toolbar d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <button type="button"
                                class="btn btn-light border merchant-sidebar-toggle"
                                data-merchant-sidebar-toggle
                                aria-label="Toggle sidebar">
                            <i class="bi bi-list fs-4"></i>
                        </button>

                        <div>
                            <div class="text-uppercase text-muted small fw-semibold">
                                Merchant
                            </div>
                            <h1 class="h4 fw-bold mb-0" th:text="${pageTitle}">
                                Merchant
                            </h1>
                        </div>
                    </div>
                </div>

                <div id="alertContainer" class="mt-3"></div>

                <div th:replace="${content}">
                    <div class="merchant-page-card p-4">
                        Merchant content
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="merchant-notice-backdrop" data-merchant-notice-backdrop hidden></div>
    <div class="merchant-notice" data-merchant-notice hidden aria-hidden="true">
        <div class="merchant-notice-card" data-merchant-notice-card>
            <div class="merchant-notice-icon" data-merchant-notice-icon>
                <i class="bi bi-bell-fill"></i>
            </div>
            <div class="merchant-notice-body">
                <div class="merchant-notice-title" data-merchant-notice-title>Thông báo</div>
                <div class="merchant-notice-message" data-merchant-notice-message></div>
            </div>
            <button type="button"
                    class="merchant-notice-close"
                    data-merchant-notice-close
                    aria-label="Close notification">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/merchant-shell.js}"></script>
</div>
</body>
</html>
