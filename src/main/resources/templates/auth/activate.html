<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kích hoạt tài khoản - Trưa Nay Ăn Gì?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activate-card {
            max-width: 440px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 36px;
        }
    </style>
</head>

<body>

    <div class="card activate-card p-4 text-center">
        <div class="card-body">

            <div th:if="${success}" class="icon-circle bg-success bg-opacity-10 text-success">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <div th:unless="${success}" class="icon-circle bg-danger bg-opacity-10 text-danger">
                <i class="bi bi-x-circle-fill"></i>
            </div>

            <h4 class="mb-3" th:text="${success} ? 'Kích hoạt thành công!' : 'Kích hoạt thất bại'"></h4>
            <p class="text-muted mb-4" th:text="${message}"></p>

            <a href="/login" class="btn btn-primary w-100" style="background-color:#ff6b35;border-color:#ff6b35;">
                Đến trang đăng nhập
            </a>
        </div>
    </div>

</body>

</html>
