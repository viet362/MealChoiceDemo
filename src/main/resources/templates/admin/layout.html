<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="shell(pageTitle, activeMenu, content)"
     class="admin-shell">

  <!-- Navbar -->
  <div th:replace="~{layout/navbar :: navbar}"></div>

  <div class="admin-workspace">

    <!-- Sidebar mobile backdrop -->
    <div class="admin-backdrop"
         data-admin-sidebar-backdrop>
    </div>

    <!-- Sidebar -->
    <aside th:replace="~{admin/sidebar :: sidebar(${activeMenu})}">
    </aside>

    <!-- Nội dung chính -->
    <main class="admin-main">

      <div class="admin-main-inner">

        <!-- Toolbar -->
        <div class="admin-toolbar
                            d-flex flex-column flex-md-row
                            align-items-md-center
                            justify-content-between
                            gap-3">

          <div class="d-flex align-items-center gap-3">

            <button type="button"
                    class="btn btn-light border admin-sidebar-toggle"
                    data-admin-sidebar-toggle
                    aria-label="Toggle sidebar">

              <i class="bi bi-list fs-4"></i>

            </button>

            <div>

              <div class="text-uppercase
                                        text-muted
                                        small
                                        fw-semibold">
                Admin
              </div>

              <h1 class="h4 fw-bold mb-0"
                  th:text="${pageTitle}">
                Quản lý Admin
              </h1>

            </div>

          </div>

        </div>

        <!-- Thông báo -->
        <div id="alertContainer"
             class="mt-3">
        </div>

        <!-- Nội dung từng trang -->
        <div th:replace="${content}">

          <div class="admin-page-card p-4">
            Admin content
          </div>

        </div>

      </div>

    </main>

  </div>

  <!-- Popup thông báo -->
  <div class="admin-notice-backdrop"
       data-admin-notice-backdrop
       hidden>
  </div>

  <div class="admin-notice"
       data-admin-notice
       hidden
       aria-hidden="true">

    <div class="admin-notice-card">

      <div class="admin-notice-icon"
           data-admin-notice-icon>

        <i class="bi bi-bell-fill"></i>

      </div>

      <div class="admin-notice-body">

        <div class="admin-notice-title"
             data-admin-notice-title>
          Thông báo
        </div>

        <div class="admin-notice-message"
             data-admin-notice-message>
        </div>

      </div>

      <button type="button"
              class="admin-notice-close"
              data-admin-notice-close
              aria-label="Close notification">

        <i class="bi bi-x-lg"></i>

      </button>

    </div>

  </div>

  <!-- Footer -->
  <div th:replace="~{layout/footer :: footer}">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <script th:src="@{/js/admin-shell.js}">
  </script>

</div>

</body>
</html>
