<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Chi tiết đối tác vận chuyển</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">


<div th:replace="~{layout/navbar :: navbar}"></div>


<div class="container py-4">


    <!-- HEADER -->

    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-2 mb-4">

        <div>

            <a th:href="@{/admin/delivery-partners}"
               class="text-decoration-none text-muted">

                <i class="bi bi-arrow-left me-1"></i>

                Danh sách đối tác

            </a>


            <h3 class="fw-bold mt-2 mb-0">

                <i class="bi bi-truck
                          text-danger me-2"></i>

                <span th:text="${partner.partnerName}">
                    Giao Hàng Nhanh
                </span>

            </h3>

        </div>


        <a th:href="@{/admin/delivery-partners/{id}/edit(id=${partner.id})}"
           class="btn btn-primary rounded-pill px-4">

            <i class="bi bi-pencil me-1"></i>

            Chỉnh sửa

        </a>

    </div>


    <div class="row g-4">


        <!-- =========================================== -->
        <!-- THÔNG TIN -->
        <!-- =========================================== -->

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm rounded-4 h-100">

                <div class="card-header bg-white border-0 p-4">

                    <h5 class="fw-bold mb-0">

                        <i class="bi bi-info-circle
                                  text-danger me-2"></i>

                        Thông tin đối tác

                    </h5>

                </div>


                <div class="card-body px-4 pb-4">

                    <div class="row g-4">


                        <div class="col-md-6">

                            <small class="text-muted">
                                Mã đối tác
                            </small>

                            <div class="fw-bold"
                                 th:text="${partner.partnerCode}">
                                GHN
                            </div>

                        </div>


                        <div class="col-md-6">

                            <small class="text-muted">
                                Trạng thái
                            </small>

                            <div>

                                <span th:if="${partner.status.name() == 'ACTIVE'}"
                                      class="badge bg-success rounded-pill">

                                    Hoạt động

                                </span>


                                <span th:if="${partner.status.name() == 'BLOCKED'}"
                                      class="badge bg-secondary rounded-pill">

                                    Đã khóa

                                </span>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <small class="text-muted">
                                Email
                            </small>

                            <div th:text="${partner.email ?: '--'}">
                                --
                            </div>

                        </div>


                        <div class="col-md-6">

                            <small class="text-muted">
                                Điện thoại
                            </small>

                            <div th:text="${partner.phone ?: '--'}">
                                --
                            </div>

                        </div>


                        <div class="col-12">

                            <small class="text-muted">
                                Địa chỉ
                            </small>

                            <div th:text="${partner.address ?: '--'}">
                                --
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================================== -->
        <!-- GIÁ -->
        <!-- =========================================== -->

        <div class="col-lg-5">

            <div class="card border-0 shadow-sm rounded-4 h-100">

                <div class="card-header bg-white border-0 p-4">

                    <h5 class="fw-bold mb-0">

                        <i class="bi bi-cash-coin
                                  text-success me-2"></i>

                        Chính sách giá

                    </h5>

                </div>


                <div class="card-body px-4 pb-4">


                    <div class="mb-3">

                        <small class="text-muted">
                            Phí cơ bản
                        </small>

                        <div class="fs-4 fw-bold text-success">

                            <span th:text="${#numbers.formatDecimal(
                                    partner.baseFee,
                                    0,
                                    'COMMA',
                                    0,
                                    'POINT'
                                    )}">
                                15000
                            </span>

                            đ

                        </div>


                        <small class="text-muted">

                            cho

                            <span th:text="${partner.baseDistanceKm}">
                                3
                            </span>

                            km đầu

                        </small>

                    </div>


                    <hr>


                    <div class="mb-3">

                        <small class="text-muted">
                            Mỗi km tiếp theo
                        </small>

                        <div class="fw-bold">

                            <span th:text="${#numbers.formatDecimal(
                                    partner.feePerKm,
                                    0,
                                    'COMMA',
                                    0,
                                    'POINT'
                                    )}">
                                5000
                            </span>

                            đ/km

                        </div>

                    </div>


                    <hr>


                    <div>

                        <small class="text-muted">
                            Hệ số giờ cao điểm
                        </small>

                        <div>

                            <span class="badge bg-warning
                                         text-dark fs-6 mt-1">

                                x<span th:text="${partner.peakMultiplier}">
                                    1.2
                                </span>

                            </span>

                        </div>

                    </div>


                </div>

            </div>

        </div>


        <!-- =========================================== -->
        <!-- THÔNG TIN KHÓA -->
        <!-- =========================================== -->

        <div class="col-12"
             th:if="${partner.status.name() == 'BLOCKED'}">

            <div class="alert alert-danger rounded-4 shadow-sm">

                <h6 class="fw-bold">

                    <i class="bi bi-lock-fill me-1"></i>

                    Đối tác đang bị khóa

                </h6>


                <div>

                    <strong>Lý do:</strong>

                    <span th:text="${partner.lockReason}">
                    </span>

                </div>


                <div class="mt-1"
                     th:if="${partner.lockedAt != null}">

                    <strong>Thời điểm khóa:</strong>

                    <span th:text="${#temporals.format(
                            partner.lockedAt,
                            'dd/MM/yyyy HH:mm'
                            )}">
                    </span>

                </div>

            </div>

        </div>


    </div>

</div>


<div th:replace="~{layout/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
